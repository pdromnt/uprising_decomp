name: Build release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve existing release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          source_ref=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 32
            platform: x86
          - bits: 64
            platform: x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Set up MinGW
        id: mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: ${{ matrix.platform }}
      - name: Build and run asset-free checks
        shell: pwsh
        run: |
          $compiler=(Get-Command '${{ steps.mingw.outputs.gcc }}').Source
          ./source/scripts/build.ps1 -Bits ${{ matrix.bits }} -Compiler $compiler -OutputDirectory ./source/build/package -ExecutableName uprising.exe -Configuration Release -Tests
      - name: Package game
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./source/scripts/package-release.ps1 -Version $env:RELEASE_TAG -Bits ${{ matrix.bits }} -Executable ./source/build/package/uprising.exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.platform }}
          path: source/dist/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-windows-*
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag --generate-notes
          fi
