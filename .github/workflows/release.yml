name: Build release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve existing release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          source_ref=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      package_version: ${{ inputs.release_tag }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: runtime-*
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
          fi
