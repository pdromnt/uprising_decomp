name: Native builds
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      package_version:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86
            runner: windows-2022
            mingw: x86
            bits: 32
          - platform: windows-x64
            runner: windows-2022
            mingw: x64
            bits: 64
          - platform: windows-arm64
            runner: windows-11-arm
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Set up MinGW
        if: matrix.mingw != ''
        id: mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: ${{ matrix.mingw }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config build-essential libgl1-mesa-dev \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libudev-dev
      - name: Build MinGW and run checks
        if: matrix.mingw != ''
        shell: pwsh
        run: |
          $compiler=(Get-Command '${{ steps.mingw.outputs.gcc }}').Source
          ./source/scripts/build.ps1 -Bits ${{ matrix.bits }} -Compiler $compiler -OutputDirectory ./source/build/output -ExecutableName uprising.exe -Configuration Release -Tests
      - name: Configure Windows ARM64
        if: matrix.platform == 'windows-arm64'
        run: cmake -S source -B source/build/native -A ARM64 -DBUILD_TESTING=ON -DUPRISING_EXECUTABLE_NAME=uprising -DUPRISING_ASSET_DIRECTORY=${{ github.workspace }}/source/build/output
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S source -B source/build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DUPRISING_ASSET_DIRECTORY=${{ github.workspace }}/source/build/output
      - name: Build native
        if: matrix.mingw == ''
        run: cmake --build source/build/native --config Release --parallel 2
      - name: Run native checks
        if: matrix.mingw == ''
        run: ctest --test-dir source/build/native -C Release --output-on-failure
      - name: Stage runtime
        shell: pwsh
        run: |
          $build=if('${{ matrix.mingw }}'){'source/build/windows-${{ matrix.bits }}'}else{'source/build/native'}
          cmake --install $build --config Release --prefix source/build/stage --component Runtime
          if($LASTEXITCODE){throw 'Runtime install failed.'}
      - name: Package and verify architecture
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || 'snapshot' }}
        run: ./source/scripts/package-release.ps1 -Version $env:PACKAGE_VERSION -Platform '${{ matrix.platform }}' -StageDirectory source/build/stage
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: source/dist/*
          if-no-files-found: error
          retention-days: 7
